services:
  evolution-api:
    image: evoapicloud/evolution-api:latest
    container_name: evolution_api_cardapio
    restart: always
    ports:
      - "8080:8080"
    environment:
      # ==============================================================================
      # CONFIGURAÇÕES DO SERVIDOR
      # ==============================================================================
      - SERVER_TYPE=http
      - SERVER_PORT=8080
      - SERVER_URL=http://localhost:8080

      # ==============================================================================
      # AUTENTICAÇÃO E CHAVE DA API
      # ==============================================================================
      # Esta chave será usada no campo "Token do Gateway WhatsApp" no seu painel admin
      - AUTHENTICATION_TYPE=apikey
      - AUTHENTICATION_API_KEY=cardapio_evolution_secret_2026
      - AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES=true

      # ==============================================================================
      # ARMAZENAMENTO DAS SESSÕES DE WHATSAPP
      # ==============================================================================
      # Usa armazenamento em arquivos locais para rapidez e simplicidade sem bancos extras
      - DATABASE_ENABLED=false
      - CACHE_REDIS_ENABLED=false

      # ==============================================================================
      # CONFIGURAÇÕES DO WHATSAPP (BAILEYS)
      # ==============================================================================
      - CONFIG_SESSION_PHONE_VERSION=true
      - QRCODE_LIMIT=30
      - QRCODE_COLOR=#198754

      # ==============================================================================
      # LOGS
      # ==============================================================================
      - LOG_LEVEL=ERROR,WARN,DEBUG,INFO,LOG
      - LOG_COLOR=true
      - LOG_BAILEYS=error

    volumes:
      # Persistência das instâncias e conexões de QR Code salvas
      - evolution_instances:/evolution/instances
      - evolution_store:/evolution/store

volumes:
  evolution_instances:
    name: evolution_instances_data
  evolution_store:
    name: evolution_store_data
